# dvc.yaml
# Defines the full ML pipeline.
# Run with: dvc repro
# DVC figures out what changed and only reruns affected stages.

stages:

  ingest:
    cmd: python src/data/ingestion.py
    deps:
      - src/data/ingestion.py
      - data/raw/german_credit_data.csv
      - configs/config.yaml
    
  preprocess:
    cmd: python src/data/preprocessing.py
    deps:
      - src/data/preprocessing.py
      - data/raw/german_credit_data.csv
      - configs/config.yaml
    outs:
      - data/processed/cleaned.csv

  build_features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - data/processed/cleaned.csv
      - configs/config.yaml
    outs:
      - data/features/features.csv
      - models/robust_scaler.pkl
    params:
      - params.yaml:
          - model.n_clusters

  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - data/features/features.csv
      - configs/config.yaml
    outs:
      - models/credit_risk_cluster_model.pkl
    params:
      - params.yaml:
          - model.n_clusters
          - model.k_min
          - model.k_max
          - model.random_state
    metrics:
      - metrics/train_metrics.json:
          cache: false

  evaluate:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - models/credit_risk_cluster_model.pkl
      - data/processed/cleaned.csv
      - data/features/features.csv
      - configs/config.yaml
    outs:
      - data/processed/labeled_customers.csv
    metrics:
      - metrics/eval_metrics.json:
          cache: false