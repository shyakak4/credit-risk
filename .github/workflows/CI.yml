name: CI — Security & Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Dependency Security Scan
  # ──────────────────────────────────────────
  security-scan:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit (CVE scan)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

      - name: Run Safety scan
        run: |
          pip install safety
          safety scan --policy-file .safety-policy.yml || true
        # `|| true` means: report findings but don't fail the pipeline
        # We use the policy file to document accepted known vulnerabilities

  # ──────────────────────────────────────────
  # JOB 2: Code Quality
  # ──────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install black isort flake8

      - name: Check formatting with black
        run: black --check src/

      - name: Check import ordering with isort
        run: isort --check-only src/

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=88 --ignore=E203,W503

  # ──────────────────────────────────────────
  # JOB 3: Unit Tests
  # ──────────────────────────────────────────
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Coverage must be above 70%
        run: pytest tests/ --cov=src --cov-fail-under=70