data:
  raw_path: "data/raw/german_credit_data.csv"
  processed_path: "data/processed/cleaned.csv"
  features_path: "data/features/features.csv"
  output_path: "data/processed/labeled_customers.csv"
  expected_columns:
    - "Age"
    - "Sex"
    - "Job"
    - "Housing"
    - "Saving accounts"
    - "Checking account"
    - "Credit amount"
    - "Duration"
    - "Purpose"

model:
  type: "clustering"
  random_state: 42
  artifact_path: "models/"
  model_name: "credit_risk_cluster_model"
  scaler_path: "models/robust_scaler.pkl"